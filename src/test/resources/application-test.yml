# Profil « test » des tests d'intégration : H2 en mémoire (mode PostgreSQL), aucun service extérieur.
# Le schéma vient toujours de Liquibase ; ddl-auto=validate vérifie que les entités correspondent.
spring:
  datasource:
    url: jdbc:h2:mem:batulo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  # H2 stocke TEXT en CLOB : la validation Hibernate est faite contre PostgreSQL au démarrage normal, pas ici.
  # Le schéma reste créé par les mêmes changesets Liquibase.
  jpa:
    hibernate:
      ddl-auto: none
  # Jamais de vrai courriel : les tests remplacent EmailService par un mock.
  mail:
    host: localhost
    port: 2525

# Toutes les valeurs que .env.properties ou une variable d'environnement pourraient changer sont fixées ici :
# les tests ne dépendent pas de la configuration locale du développeur.
batulo:
  # URL absolue du logo dans le formulaire public.
  url-base: http://localhost:8080
  personnalisation:
    couleur-defaut: "#005CBB"
  fuseau-horaire: America/Toronto
  jwt:
    secret: secret-de-test-batulo-au-moins-32-octets-0123456789
    duree-acces-minutes: 15
    duree-rafraichissement-jours: 7
  courriel:
    expediteur: Batulo <no-reply@batulo.local>
  stripe:
    cle-secrete: ""
    cle-publique: ""
    secret-webhook: ""
  cors:
    origines: http://localhost:4200
  collecte:
    url-formulaire: http://localhost:4200/s
    # Les tests envoient beaucoup de requêtes publiques : limite relevée (un test dédié la vérifie).
    limite-lecture-par-minute: 100000
    limite-envoi-par-minute: 100000
    faire-confiance-proxy: false
  abonnement:
    devise: cad
    # Pas de passage planifié pendant les tests (le 31 février n'existe pas).
    cron-expiration: "0 0 0 31 2 *"
  moosyl:
    url-base: http://localhost:1
    cle-api: cle-moosyl-de-test
    secret-webhook: secret-webhook-moosyl-de-test
    url-retour: http://localhost:4200/admin/abonnement/paiement-mobile
    prix-mensuel-mru: 40
    prix-annuel-mru: 80
    expiration-minutes: 30
  mot-de-passe:
    url-reinitialisation: http://localhost:4200/reinitialiser-mot-de-passe

# Le super admin de .env.properties n'est pas créé : chaque test crée ses propres comptes.
SUPER_ADMIN_EMAIL: ""
SUPER_ADMIN_PASSWORD: ""

logging:
  level:
    com.batulo: WARN
