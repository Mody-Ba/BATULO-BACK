databaseChangeLog:
  - changeSet:
      id: 007-creer-table-notification
      author: batulo
      changes:
        - createTable:
            tableName: notification
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column:
                  name: destinataire_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_notification_destinataire
                    references: utilisateur(id)
                    deleteCascade: true
              - column: { name: type, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: titre, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: message, type: TEXT, constraints: { nullable: false } }
              - column: { name: lue, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: date_creation, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - createIndex:
            tableName: notification
            indexName: idx_notification_destinataire
            columns:
              - column: { name: destinataire_id }
              - column: { name: lue }
