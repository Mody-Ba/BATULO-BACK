databaseChangeLog:
  - changeSet:
      id: 002-creer-table-utilisateur
      author: batulo
      changes:
        - createTable:
            tableName: utilisateur
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: prenom, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: nom, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: courriel, type: VARCHAR(255), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_utilisateur_courriel } }
              - column: { name: mot_de_passe, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: role, type: VARCHAR(20), constraints: { nullable: false } }
              - column:
                  name: entreprise_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_utilisateur_entreprise
                    references: entreprise(id)
                    deleteCascade: true
              - column: { name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: mot_de_passe_temporaire, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: mot_de_passe_temporaire_expire_le, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: peut_creer_sondages, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: date_creation, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: date_modification, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - createIndex:
            tableName: utilisateur
            indexName: idx_utilisateur_entreprise_role
            columns:
              - column: { name: entreprise_id }
              - column: { name: role }
        - sql:
            comment: Valeurs autorisées pour le rôle
            sql: ALTER TABLE utilisateur ADD CONSTRAINT ck_utilisateur_role CHECK (role IN ('SUPER_ADMIN','ADMIN','GESTIONNAIRE'))
