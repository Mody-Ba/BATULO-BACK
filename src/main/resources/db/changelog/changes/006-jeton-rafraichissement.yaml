databaseChangeLog:
  - changeSet:
      id: 006-creer-table-jeton-rafraichissement
      author: batulo
      changes:
        - createTable:
            tableName: jeton_rafraichissement
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column:
                  name: utilisateur_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_jeton_rafr_utilisateur
                    references: utilisateur(id)
                    deleteCascade: true
              - column: { name: jeton_hash, type: VARCHAR(64), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_jeton_rafr_hash } }
              - column: { name: expire_le, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: revoque, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: date_creation, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
