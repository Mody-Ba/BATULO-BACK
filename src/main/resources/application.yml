# Configuration Batulo.
# Les valeurs sensibles viennent des variables d'environnement ou du fichier
# .env.properties (racine du projet, ignoré par Git). Voir .env.properties.example.
spring:
  application:
    name: batulo
  config:
    import: optional:file:.env.properties
  profiles:
    # Profil « dev » par défaut pendant le développement : il active la route /api/dev (carte de test Stripe).
    # En production : SPRING_PROFILES_ACTIVE=prod (variable d'environnement ou .env.properties).
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/batulo}
    username: ${DB_USERNAME:batulo}
    password: ${DB_PASSWORD:batulo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          # Un serveur SMTP lent ou absent ne doit pas bloquer les requêtes.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

batulo:
  url-base: ${APP_BASE_URL:http://localhost:${server.port}}
  # Fuseau des dates dans les courriels et de la tâche quotidienne.
  fuseau-horaire: ${BATULO_FUSEAU_HORAIRE:America/Toronto}
  jwt:
    # Au moins 32 octets (HS256). Obligatoire : l'application refuse de démarrer sans.
    secret: ${JWT_SECRET:}
    emetteur: batulo
    duree-acces-minutes: ${JWT_ACCESS_MINUTES:15}
    duree-rafraichissement-jours: ${JWT_REFRESH_DAYS:7}
  # Origines autorisées à appeler l'API depuis un navigateur (séparées par des virgules, jamais « * »).
  cors:
    origines: ${CORS_ORIGINS:http://localhost:4200}
  courriel:
    expediteur: ${MAIL_FROM:Batulo <no-reply@batulo.local>}
  stripe:
    cle-secrete: ${STRIPE_SECRET_KEY:}
    # Clé publique (pk_test_...) renvoyée au frontend avec le clientSecret, pour Stripe.js.
    cle-publique: ${STRIPE_PUBLISHABLE_KEY:}
    secret-webhook: ${STRIPE_WEBHOOK_SECRET:}
  abonnement:
    devise: ${STRIPE_CURRENCY:cad}
    # Prix des formules en centimes (RG-10) : MENSUEL 1 $, ANNUEL 2 $.
    prix-mensuel-centimes: 100
    prix-annuel-centimes: 200
    jours-alerte-expiration: 7
    # Tâche quotidienne (rappels et expirations) : tous les jours à 8 h, heure de batulo.fuseau-horaire.
    # Elle tourne aussi une fois au démarrage.
    cron-expiration: ${ABONNEMENT_CRON:0 0 8 * * *}
  mot-de-passe:
    duree-temporaire-heures: 24
    duree-lien-reinitialisation-minutes: 60
    # Page qui recevra le jeton de réinitialisation (frontend Angular plus tard).
    url-reinitialisation: ${RESET_PASSWORD_URL:http://localhost:4200/reinitialiser-mot-de-passe}

logging:
  level:
    com.batulo: INFO
