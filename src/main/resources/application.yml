# Configuration Batulo.
# Les valeurs sensibles viennent des variables d'environnement ou du fichier
# .env.properties (racine du projet, ignoré par Git). Voir .env.properties.example.
spring:
  application:
    name: batulo
  config:
    import: optional:file:.env.properties
  profiles:
    # Profil « dev » par défaut pendant le développement : il active la route /api/dev (carte de test Stripe).
    # En production : SPRING_PROFILES_ACTIVE=prod (variable d'environnement ou .env.properties).
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/batulo}
    username: ${DB_USERNAME:batulo}
    password: ${DB_PASSWORD:batulo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Charge les collections par lots (sections, questions, options d'un sondage) : peu de requêtes,
        # sans produit cartésien.
        default_batch_fetch_size: 100
  # Envoi du logo (multipart) : refusé avant lecture au-delà de ces tailles (413 FICHIER_TROP_GROS).
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          # Un serveur SMTP lent ou absent ne doit pas bloquer les requêtes.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

batulo:
  url-base: ${APP_BASE_URL:http://localhost:${server.port}}
  # Fuseau des dates dans les courriels et de la tâche quotidienne.
  fuseau-horaire: ${BATULO_FUSEAU_HORAIRE:America/Toronto}
  jwt:
    # Au moins 32 octets (HS256). Obligatoire : l'application refuse de démarrer sans.
    secret: ${JWT_SECRET:}
    emetteur: batulo
    duree-acces-minutes: ${JWT_ACCESS_MINUTES:15}
    duree-rafraichissement-jours: ${JWT_REFRESH_DAYS:7}
  # Origines autorisées à appeler l'API depuis un navigateur (séparées par des virgules, jamais « * »).
  cors:
    origines: ${CORS_ORIGINS:http://localhost:4200}
  courriel:
    expediteur: ${MAIL_FROM:Batulo <no-reply@batulo.local>}
  stripe:
    cle-secrete: ${STRIPE_SECRET_KEY:}
    # Clé publique (pk_test_...) renvoyée au frontend avec le clientSecret, pour Stripe.js.
    cle-publique: ${STRIPE_PUBLISHABLE_KEY:}
    secret-webhook: ${STRIPE_WEBHOOK_SECRET:}
  abonnement:
    devise: ${STRIPE_CURRENCY:cad}
    # Prix des formules en centimes (RG-10) : MENSUEL 1 $, ANNUEL 2 $.
    prix-mensuel-centimes: 100
    prix-annuel-centimes: 200
    jours-alerte-expiration: 7
    # Tâche quotidienne (rappels et expirations) : tous les jours à 8 h, heure de batulo.fuseau-horaire.
    # Elle tourne aussi une fois au démarrage.
    cron-expiration: ${ABONNEMENT_CRON:0 0 8 * * *}
  # Paiement mobile Moosyl (Bankily, Sedad, Masrivi), en MRU entiers. Même URL en sandbox et en production :
  # l'environnement dépend de la clé. Le webhook (POST /api/webhooks/moosyl) est la source principale du statut.
  moosyl:
    url-base: ${MOOSYL_BASE_URL:https://api.moosyl.com}
    # Clé SECRÈTE (serveur seulement), envoyée telle quelle dans l'en-tête Authorization.
    cle-api: ${MOOSYL_API_KEY:}
    # Secret choisi à la création du webhook dans le tableau de bord Moosyl (HMAC-SHA256 du corps).
    secret-webhook: ${MOOSYL_WEBHOOK_SECRET:}
    # Page du frontend où Moosyl renvoie l'admin ; ?reference=... y est ajouté.
    url-retour: ${MOOSYL_URL_RETOUR:http://localhost:4200/admin/abonnement/paiement-mobile}
    prix-mensuel-mru: ${MOOSYL_PRIX_MENSUEL_MRU:40}
    prix-annuel-mru: ${MOOSYL_PRIX_ANNUEL_MRU:80}
    # Durée de validité d'une session de paiement (5 à 1440 minutes).
    expiration-minutes: 30
  collecte:
    # Page du formulaire répondant (frontend Angular) : le jeton du sondage y est ajouté (lien et QR code).
    url-formulaire: ${PUBLIC_FORM_URL:http://localhost:4200/s}
    # Limite des routes publiques, par adresse IP et par minute.
    limite-lecture-par-minute: ${PUBLIC_RATE_GET:120}
    limite-envoi-par-minute: ${PUBLIC_RATE_POST:20}
    # true seulement derrière un proxy de confiance (l'adresse vient alors de X-Forwarded-For).
    faire-confiance-proxy: ${TRUST_PROXY:false}
  # Invitations nominatives (phase 4, étape 4).
  invitations:
    # Clé HMAC des liens personnels, dédiée (jamais JWT_SECRET), au moins 32 octets. Obligatoire : l'application
    # refuse de démarrer sans. La changer rend invalides tous les liens d'invitation déjà envoyés.
    secret: ${INVITATION_SECRET:}
    # Courriels d'invitation et de relance au plus, par entreprise et par heure glissante.
    envois-par-heure: ${INVITATION_ENVOIS_PAR_HEURE:500}
    # Délai minimal entre deux envois à la même personne (relance).
    delai-relance-heures: 24
    # Invités au plus par sondage (lignée) et lignes au plus par import CSV.
    invites-max: 10000
    lignes-import-max: 1000
  # Apparence des formulaires (phase 4, étape 2).
  personnalisation:
    # Couleur principale par défaut des formulaires : celle du thème du front (azure, ton 40).
    couleur-defaut: ${BATULO_COULEUR_DEFAUT:#005CBB}
    # Logo : PNG ou JPEG, au plus 1 Mo (aligné sur spring.servlet.multipart.max-file-size) et 2000 x 2000 pixels.
    logo-taille-max: 1048576
    logo-dimension-max: 2000
  statistiques:
    # En dessous de ce nombre de répondants, un groupe est signalé « petitEffectif » (prudence avant de conclure).
    effectif-minimum: 5
  mot-de-passe:
    duree-temporaire-heures: 24
    duree-lien-reinitialisation-minutes: 60
    # Page qui recevra le jeton de réinitialisation (frontend Angular plus tard).
    url-reinitialisation: ${RESET_PASSWORD_URL:http://localhost:4200/reinitialiser-mot-de-passe}

logging:
  level:
    com.batulo: INFO
